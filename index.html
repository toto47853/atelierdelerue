<div id="odoo-3d-gallery-wrapper">
<style>
  #odoo-3d-gallery-wrapper {
    position: fixed; inset: 0; z-index: 1000;
    background: #111; overflow: hidden;
    touch-action: none;
  }
  #odoo-3d-gallery-wrapper canvas { display: block; touch-action: none; }
  #g3d-crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255,255,255,0.8);
    pointer-events: none; z-index: 1005; display: none;
  }
  #g3d-blocker {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75); z-index: 1010; cursor: pointer;
  }
  #g3d-instructions { text-align: center; color: #fff; max-width: 420px; padding: 30px; font-family: Arial, sans-serif; }
  #g3d-instructions h1 { margin: 0 0 10px; font-size: 26px; }
  #g3d-instructions p { margin: 6px 0; font-size: 15px; opacity: 0.85; line-height: 1.5; }
  #g3d-instructions .key {
    display: inline-block; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
    padding: 2px 8px; margin: 0 2px; font-size: 13px;
  }
  #g3d-loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #111; color: #fff; z-index: 1020; font-family: Arial, sans-serif;
  }
  #g3d-loading .bar-track { width: 260px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; margin-top: 16px; }
  #g3d-loading .bar-fill { height: 100%; width: 0%; background: #4da3ff; transition: width 0.15s ease-out; }
  #g3d-paint-hud {
    position: fixed; bottom: 14px; left: 14px;
    color: rgba(255,255,255,0.85);
    font-size: 13px; font-family: Arial, sans-serif;
    z-index: 1005; pointer-events: none; user-select: none;
    background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 6px;
    line-height: 1.5; display: none;
  }

  /* ---- Bouton et fenêtre de contact ---- */
  #g3d-contact-btn {
    position: fixed; top: 16px; right: 16px;
    z-index: 1050; cursor: pointer;
    background: rgba(20,20,20,0.75); color: #fff;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 10px;
    padding: 16px 24px; font-family: Arial, sans-serif; font-size: 18px;
  }
  #g3d-contact-btn:hover { background: rgba(40,40,40,0.9); }
  #g3d-contact-modal {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
  }
  #g3d-contact-box {
    background: #1c1c1c; color: #fff; width: 90%; max-width: 380px;
    border-radius: 10px; padding: 22px; font-family: Arial, sans-serif;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #g3d-contact-box h2 { margin: 0 0 14px; font-size: 19px; }
  #g3d-contact-box input, #g3d-contact-box textarea {
    width: 100%; box-sizing: border-box; margin-bottom: 10px;
    padding: 9px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; font-family: Arial, sans-serif;
  }
  #g3d-contact-box textarea { min-height: 90px; resize: vertical; }
  .g3d-contact-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .g3d-contact-actions button {
    padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 14px; font-family: Arial, sans-serif;
  }
  #g3d-contact-cancel { background: rgba(255,255,255,0.15); color: #fff; }
  #g3d-contact-send { background: #4da3ff; color: #111; font-weight: bold; }
  #g3d-contact-error { color: #ff8686; font-size: 13px; margin: -4px 0 10px; display: none; }
  #g3d-contact-status { font-size: 13px; margin: -4px 0 10px; display: none; }
  #g3d-contact-send:disabled { opacity: 0.6; cursor: default; }

  /* ---- Croix de flèches tactile (mobile) ---- */
  #g3d-dpad {
    position: fixed; bottom: 24px; left: 24px;
    z-index: 1040; display: none;
    grid-template-columns: 84px 84px 84px;
    grid-template-rows: 84px 84px 84px;
    gap: 6px;
  }
  #g3d-dpad button {
    width: 84px; height: 84px; border-radius: 14px;
    background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.5);
    color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none; touch-action: none; padding: 0;
  }
  #g3d-dpad button.active { background: rgba(77,163,255,0.55); border-color: #4da3ff; }
  #g3d-dpad-up { grid-column: 2; grid-row: 1; }
  #g3d-dpad-left { grid-column: 1; grid-row: 2; }
  #g3d-dpad-right { grid-column: 3; grid-row: 2; }
  #g3d-dpad-down { grid-column: 2; grid-row: 3; }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
(function () {
  var MODEL_URL = 'gallery.glb';
  var PAINTINGS_ZIP_URL = 'paintings.zip';

  // ====================================================================
  // CONFIGURATION (aucune clé secrète dans ce fichier : le bin jsonbin est en lecture publique,
  // et l'admin saisit sa clé à l'ouverture de ?adm)
  // ====================================================================
  var STORAGE_BIN_ID = '6ac6a8dbffd5d16053572822';
  var CONTACT_EMAIL = 'zonedel81@gmail.com';
  // EmailJS : à remplir avec les 3 valeurs de ton compte emailjs.com (elles sont faites pour être publiques)
  var EMAILJS_SERVICE_ID = 'VOTRE_SERVICE_ID';
  var EMAILJS_TEMPLATE_ID = 'VOTRE_TEMPLATE_ID';
  var EMAILJS_PUBLIC_KEY = 'VOTRE_CLE_PUBLIQUE';
  // ====================================================================

  var isAdminMode = window.location.pathname.includes('/adm') || window.location.search.includes('adm');

  var ADMIN_KEY = null;
  if (isAdminMode) {
    var enteredKey = window.prompt("Clé d'administration :");
    if (enteredKey && enteredKey.trim()) {
      ADMIN_KEY = enteredKey.trim();
    } else {
      isAdminMode = false;
      alert('Mode visiteur activé.');
    }
  }

  if (isAdminMode) {
    document.getElementById('g3d-mode-title').innerText = 'Mode Administrateur (Entrée : Sauvegarder)';
  }

  if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
    var instrEl = document.getElementById('g3d-instructions');
    if (instrEl) {
      var extraLines = instrEl.querySelectorAll('p');
      for (var pi = 2; pi < extraLines.length; pi++) extraLines[pi].style.display = 'none';
      var touchP = document.createElement('p');
      touchP.innerHTML = 'Glisse le doigt pour regarder  •  Utilise les flèches pour te déplacer';
      instrEl.appendChild(touchP);
    }
    var dpadEl = document.getElementById('g3d-dpad');
    if (dpadEl) dpadEl.style.display = 'grid';
  }

  var PRESET_PAINTINGS = [];

  var START_OFFSET_X = 0;
  var START_OFFSET_Z = 0;
  var START_OFFSET_Y = 0;
  var EYE_HEIGHT_OVERRIDE = 1.2;

  var isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var touchControlsEnabled = false;

  var moveTarget = null;
  var isAutoMoving = false;
  var AUTO_MOVE_ARRIVE_DIST = 0.25;

  var SCALE = 1;
  var EYE_HEIGHT = EYE_HEIGHT_OVERRIDE, PLAYER_RADIUS = 0.35, WALK_SPEED = 3.2, RUN_SPEED = 6.0;
  var GROUND_SNAP_SPEED = 12, MAX_STEP_UP = 0.5, RAY_LOOKAHEAD = 0.05;

  var wrapper = document.getElementById('odoo-3d-gallery-wrapper');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);
  scene.fog = new THREE.Fog(0x111111, 20, 80);

  var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 500);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  wrapper.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.25));
  var debugLight = new THREE.DirectionalLight(0xffffff, 0.35);
  debugLight.position.set(10, 20, 10);
  scene.add(debugLight);

  if (renderer.outputEncoding !== undefined && THREE.sRGBEncoding !== undefined) {
    renderer.outputEncoding = THREE.sRGBEncoding;
  }

  var controls = new THREE.PointerLockControls(camera, renderer.domElement);
  scene.add(controls.getObject());
  var pitchObject = controls.getObject().children[0];

  var blocker = document.getElementById('g3d-blocker');
  var crosshair = document.getElementById('g3d-crosshair');
  blocker.addEventListener('click', function () {
    if (isTouchDevice) {
      blocker.style.display = 'none';
      crosshair.style.display = 'none';
      touchControlsEnabled = true;
    } else {
      controls.lock();
    }
  });
  controls.addEventListener('lock', function () { blocker.style.display = 'none'; crosshair.style.display = 'block'; });
  controls.addEventListener('unlock', function () { blocker.style.display = 'flex'; crosshair.style.display = 'none'; });

  var move = { forward: false, back: false, left: false, right: false, run: false, up: false, down: false };
  document.addEventListener('keydown', function (e) {
    if (isAdminMode && e.code === 'Enter') {
      savePaintings();
      return;
    }

    if (e.code === 'KeyZ' || e.code === 'KeyW') { move.forward = true; isAutoMoving = false; }
    if (e.code === 'KeyS') { move.back = true; isAutoMoving = false; }
    if (e.code === 'KeyQ' || e.code === 'KeyA') { move.left = true; isAutoMoving = false; }
    if (e.code === 'KeyD') { move.right = true; isAutoMoving = false; }
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') move.run = true;
    if (e.code === 'Space') move.up = true;
    if (e.code === 'KeyC' || e.code === 'ControlLeft') move.down = true;

    if (isAdminMode) {
      if (e.code === 'ArrowUp') selectPainting(currentPaintingIndex + 1);
      if (e.code === 'ArrowDown') selectPainting(currentPaintingIndex - 1);
      if (e.code === 'KeyF') hangCurrentPainting();
      if (e.code === 'KeyG') removeAimedPainting();
      if (e.code === 'KeyI') { paintingScaleMultiplier *= 1.1; updatePaintHud(); }
      if (e.code === 'KeyK') { paintingScaleMultiplier /= 1.1; updatePaintHud(); }
    }
  });
  document.addEventListener('keyup', function (e) {
    if (e.code === 'KeyZ' || e.code === 'KeyW') move.forward = false;
    if (e.code === 'KeyS') move.back = false;
    if (e.code === 'KeyQ' || e.code === 'KeyA') move.left = false;
    if (e.code === 'KeyD') move.right = false;
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') move.run = false;
    if (e.code === 'Space') move.up = false;
    if (e.code === 'KeyC' || e.code === 'ControlLeft') move.down = false;
  });

  var collidableMeshes = [];
  var modelBox = new THREE.Box3();
  var raycaster = new THREE.Raycaster();
  var barFill = document.getElementById('g3d-bar-fill');
  var loadingEl = document.getElementById('g3d-loading');

  function raycastFloorY(x, fromY, z) {
    raycaster.set(new THREE.Vector3(x, fromY, z), new THREE.Vector3(0, -1, 0));
    raycaster.far = (fromY - modelBox.min.y) + (2 * SCALE);
    var hits = raycaster.intersectObjects(collidableMeshes, false);
    return hits.length > 0 ? hits[0].point.y : null;
  }
  function raycastFloorYRobust(x, fromY, z) {
    var r = PLAYER_RADIUS * 0.6;
    var offsets = [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r]];
    var best = null;
    for (var i = 0; i < offsets.length; i++) {
      var fy = raycastFloorY(x + offsets[i][0], fromY, z + offsets[i][1]);
      if (fy !== null && (best === null || fy > best)) best = fy;
    }
    return best;
  }
  function raycastCeilingDist(pos) {
    raycaster.set(pos, new THREE.Vector3(0, 1, 0));
    raycaster.far = EYE_HEIGHT + 0.3;
    var hits = raycaster.intersectObjects(collidableMeshes, false);
    return hits.length > 0 ? hits[0].distance : Infinity;
  }
  function isBlocked(position, direction, distance) {
    if (direction.lengthSq() === 0) return false;
    var dir = direction.clone().normalize();
    var origin = position.clone();
    origin.y = position.y - EYE_HEIGHT + MAX_STEP_UP + (0.05 * SCALE);
    raycaster.set(origin, dir);
    raycaster.far = distance + PLAYER_RADIUS;
    var hits = raycaster.intersectObjects(collidableMeshes, false);
    return hits.length > 0 && hits[0].distance < (PLAYER_RADIUS + RAY_LOOKAHEAD);
  }

  function getWalkTargetFromRay() {
    var hits = raycaster.intersectObjects(collidableMeshes, false);
    if (hits.length === 0) return null;
    var hit = hits[0];
    var floorY = raycastFloorYRobust(hit.point.x, hit.point.y + (2 * SCALE), hit.point.z);
    return { x: hit.point.x, z: hit.point.z, y: floorY !== null ? floorY : hit.point.y };
  }

  function startAutoMoveToScreenPoint(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    var ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
    var ndcY = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
    var target = getWalkTargetFromRay();
    if (target) { moveTarget = target; isAutoMoving = true; }
  }

  function startAutoMoveToCrosshair() {
    raycaster.set(camera.getWorldPosition(new THREE.Vector3()), camera.getWorldDirection(new THREE.Vector3()));
    raycaster.far = 200 * SCALE;
    var target = getWalkTargetFromRay();
    if (target) { moveTarget = target; isAutoMoving = true; }
  }

  renderer.domElement.addEventListener('dblclick', function () {
    if (!controls.isLocked) return;
    startAutoMoveToCrosshair();
  });

  // ---- Contrôles tactiles (mobile) ----
  var touchLook = { active: false, id: null, lastX: 0, lastY: 0, startX: 0, startY: 0, moved: false };
  var touchRotationTarget = { yaw: 0, pitch: 0 };
  var TOUCH_LOOK_SENSITIVITY = 0.0022;
  var TOUCH_LOOK_SMOOTHING = 0.18;
  var TOUCH_MAX_DELTA_PX = 40;

  renderer.domElement.addEventListener('touchstart', function (e) {
    if (!touchControlsEnabled) return;
    if (touchLook.active) return;
    var t = e.changedTouches[0];
    touchLook.active = true;
    touchLook.id = t.identifier;
    touchLook.moved = false;
    touchLook.lastX = t.clientX;
    touchLook.lastY = t.clientY;
    touchLook.startX = t.clientX;
    touchLook.startY = t.clientY;
  }, { passive: true });

  renderer.domElement.addEventListener('touchmove', function (e) {
    if (!touchControlsEnabled || !touchLook.active) return;
    var t = null;
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchLook.id) { t = e.changedTouches[i]; break; }
    }
    if (!t) return;
    e.preventDefault();
    var dx = t.clientX - touchLook.lastX;
    var dy = t.clientY - touchLook.lastY;
    dx = Math.max(-TOUCH_MAX_DELTA_PX, Math.min(TOUCH_MAX_DELTA_PX, dx));
    dy = Math.max(-TOUCH_MAX_DELTA_PX, Math.min(TOUCH_MAX_DELTA_PX, dy));
    touchLook.lastX = t.clientX;
    touchLook.lastY = t.clientY;
    if (Math.abs(t.clientX - touchLook.startX) > 8 || Math.abs(t.clientY - touchLook.startY) > 8) {
      touchLook.moved = true;
    }
    touchRotationTarget.yaw -= dx * TOUCH_LOOK_SENSITIVITY;
    touchRotationTarget.pitch -= dy * TOUCH_LOOK_SENSITIVITY;
    var MAX_PENDING = 0.35;
    touchRotationTarget.yaw = Math.max(-MAX_PENDING, Math.min(MAX_PENDING, touchRotationTarget.yaw));
    touchRotationTarget.pitch = Math.max(-MAX_PENDING, Math.min(MAX_PENDING, touchRotationTarget.pitch));
  }, { passive: false });

  function endTouchLook(e) {
    if (!touchControlsEnabled || !touchLook.active) return;
    var ended = false;
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchLook.id) { ended = true; break; }
    }
    if (!ended) return;
    if (!touchLook.moved) {
      startAutoMoveToScreenPoint(touchLook.startX, touchLook.startY);
    }
    touchLook.active = false;
    touchLook.id = null;
  }
  renderer.domElement.addEventListener('touchend', endTouchLook);
  renderer.domElement.addEventListener('touchcancel', endTouchLook);

  function applySmoothedTouchLook() {
    if (Math.abs(touchRotationTarget.yaw) < 0.00003 && Math.abs(touchRotationTarget.pitch) < 0.00003) return;
    var applyYaw = touchRotationTarget.yaw * TOUCH_LOOK_SMOOTHING;
    var applyPitch = touchRotationTarget.pitch * TOUCH_LOOK_SMOOTHING;
    controls.getObject().rotation.y += applyYaw;
    if (pitchObject) {
      pitchObject.rotation.x += applyPitch;
      pitchObject.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitchObject.rotation.x));
    }
    touchRotationTarget.yaw -= applyYaw;
    touchRotationTarget.pitch -= applyPitch;
  }

  // ---- Croix de flèches tactile : appui maintenu = se déplacer dans cette direction ----
  function setupDpadButton(id, moveKey) {
    var btn = document.getElementById(id);
    if (!btn) return;
    var start = function (e) {
      e.preventDefault();
      e.stopPropagation();
      move[moveKey] = true;
      isAutoMoving = false;
      btn.classList.add('active');
    };
    var stop = function (e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      move[moveKey] = false;
      btn.classList.remove('active');
    };
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', stop, { passive: false });
    btn.addEventListener('touchcancel', stop, { passive: false });
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', stop);
    btn.addEventListener('mouseleave', stop);
  }
  setupDpadButton('g3d-dpad-up', 'forward');
  setupDpadButton('g3d-dpad-down', 'back');
  setupDpadButton('g3d-dpad-left', 'left');
  setupDpadButton('g3d-dpad-right', 'right');

  var loader = new THREE.GLTFLoader();
  loader.load(MODEL_URL, function (gltf) {
    var model = gltf.scene;

    model.traverse(function (child) {
      if (child.isMesh) {
        child.visible = true;
        child.frustumCulled = false;
        child.receiveShadow = true;
        child.castShadow = true;
        collidableMeshes.push(child);

        if (child.material) {
          var DARKEN_FACTOR = 0.5;
          if (Array.isArray(child.material)) {
            child.material.forEach(function(m) {
              m.side = THREE.DoubleSide;
              m.transparent = false;
              m.opacity = 1.0;
              if (m.color) m.color.multiplyScalar(DARKEN_FACTOR);
            });
          } else {
            child.material.side = THREE.DoubleSide;
            child.material.transparent = false;
            child.material.opacity = 1.0;
            if (child.material.color) child.material.color.multiplyScalar(DARKEN_FACTOR);
          }
        }
      }
    });

    scene.add(model);
    modelBox.setFromObject(model);
    var center = new THREE.Vector3();
    modelBox.getCenter(center);
    var size = new THREE.Vector3();
    modelBox.getSize(size);
    var diagonal = size.length();

    SCALE = diagonal / 20;
    if (!isFinite(SCALE) || SCALE <= 0) SCALE = 1;
    EYE_HEIGHT = EYE_HEIGHT_OVERRIDE;
    PLAYER_RADIUS = 0.35 * SCALE;
    WALK_SPEED = 3.2 * SCALE;
    RUN_SPEED = 6.0 * SCALE;
    MAX_STEP_UP = 0.5 * SCALE;
    RAY_LOOKAHEAD = 0.05 * SCALE;
    camera.far = Math.max(1000, diagonal * 10);
    camera.near = Math.max(0.001, diagonal * 0.0001);
    camera.updateProjectionMatrix();
    scene.fog.near = diagonal * 2;
    scene.fog.far = diagonal * 8;

    var startY = modelBox.max.y > modelBox.min.y ? modelBox.min.y + EYE_HEIGHT + START_OFFSET_Y : center.y;
    controls.getObject().position.set(center.x + START_OFFSET_X, startY, center.z + START_OFFSET_Z);
    camera.lookAt(center.x + START_OFFSET_X + 1, startY, center.z + START_OFFSET_Z);

    loadingEl.style.display = 'none';
    blocker.style.display = 'flex';
    animate();
  }, function (xhr) {
    if (xhr.total) barFill.style.width = Math.min(100, (xhr.loaded / xhr.total) * 100) + '%';
  }, function (err) {
    loadingEl.innerHTML = '<div style="color:#ff6b6b">Erreur de chargement du modèle 3D.</div>';
    console.error(err);
  });

  var clock = new THREE.Clock();
  var forwardVec = new THREE.Vector3(), rightVec = new THREE.Vector3(), moveDir = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);
    var delta = Math.min(clock.getDelta(), 0.05);
    if (controls.isLocked || touchControlsEnabled) updateMovement(delta);
    applySmoothedTouchLook();
    renderer.render(scene, camera);
  }

  function updateMovement(delta) {
    var speed = move.run ? RUN_SPEED : WALK_SPEED;
    var step = speed * delta;
    camera.getWorldDirection(forwardVec);
    forwardVec.y = 0;
    forwardVec.normalize();
    rightVec.crossVectors(forwardVec, camera.up).normalize();

    moveDir.set(0, 0, 0);
    if (move.forward) moveDir.add(forwardVec);
    if (move.back) moveDir.sub(forwardVec);
    if (move.right) moveDir.add(rightVec);
    if (move.left) moveDir.sub(rightVec);

    var pos = controls.getObject().position;

    if (moveDir.lengthSq() > 0) {
      isAutoMoving = false;
      moveDir.normalize();
      var testX = new THREE.Vector3(moveDir.x, 0, 0);
      var testZ = new THREE.Vector3(0, 0, moveDir.z);
      if (moveDir.x !== 0 && !isBlocked(pos, testX, step)) pos.x += moveDir.x * step;
      if (moveDir.z !== 0 && !isBlocked(pos, testZ, step)) pos.z += moveDir.z * step;
    } else if (isAutoMoving && moveTarget) {
      var toTargetX = moveTarget.x - pos.x;
      var toTargetZ = moveTarget.z - pos.z;
      var dist = Math.hypot(toTargetX, toTargetZ);
      if (dist < AUTO_MOVE_ARRIVE_DIST * SCALE) {
        isAutoMoving = false;
      } else {
        var dirX = toTargetX / dist;
        var dirZ = toTargetZ / dist;
        var autoStep = Math.min(WALK_SPEED * delta, dist);
        var testX = new THREE.Vector3(dirX, 0, 0);
        var testZ = new THREE.Vector3(0, 0, dirZ);
        var movedX = false, movedZ = false;
        if (!isBlocked(pos, testX, autoStep)) { pos.x += dirX * autoStep; movedX = true; }
        if (!isBlocked(pos, testZ, autoStep)) { pos.z += dirZ * autoStep; movedZ = true; }
        if (!movedX && !movedZ) isAutoMoving = false;

        var targetYaw = Math.atan2(dirX, dirZ);
        var yawObj = controls.getObject();
        var yawDiff = targetYaw - yawObj.rotation.y;
        while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
        while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
        yawObj.rotation.y += yawDiff * Math.min(1, 6 * delta);
      }
    }

    var pos2 = controls.getObject().position;
    var floorY = raycastFloorYRobust(pos2.x, pos2.y + EYE_HEIGHT, pos2.z);

    if (floorY !== null) {
      var targetY = floorY + EYE_HEIGHT;
      var diff = targetY - pos2.y;
      if (Math.abs(diff) < MAX_STEP_UP + EYE_HEIGHT) {
        pos2.y += diff * Math.min(1, GROUND_SNAP_SPEED * delta);
      } else if (diff < 0) {
        pos2.y += Math.max(diff, -WALK_SPEED * delta * 2);
      }
    } else {
      raycaster.set(new THREE.Vector3(pos2.x, pos2.y - EYE_HEIGHT - (0.05 * SCALE), pos2.z), new THREE.Vector3(0, 1, 0));
      raycaster.far = MAX_STEP_UP + (0.3 * SCALE);
      var upHits = raycaster.intersectObjects(collidableMeshes, false);
      if (upHits.length > 0) {
        pos2.y = upHits[0].point.y + EYE_HEIGHT;
      }
    }
    var ceilDist = raycastCeilingDist(pos2);
    if (ceilDist < EYE_HEIGHT) pos2.y -= (EYE_HEIGHT - ceilDist);
  }

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var paintingTextures = [];
  var currentPaintingIndex = 0;
  var placedPaintings = [];
  var paintingScaleMultiplier = 1;
  var paintHud = document.getElementById('g3d-paint-hud');
  var textureLoader = new THREE.TextureLoader();

  function updatePaintHud() {
    if (!isAdminMode || !paintHud) return;
    if (paintingTextures.length === 0) {
      paintHud.style.display = 'none';
      return;
    }
    paintHud.style.display = 'block';
    var cur = paintingTextures[currentPaintingIndex];
    paintHud.innerHTML =
      'Tableau ' + (currentPaintingIndex + 1) + ' / ' + paintingTextures.length + ' — ' + (cur ? cur.name : '') + '<br>' +
      '↑ / ↓ changer &nbsp; F poser &nbsp; G retirer &nbsp; [I]/[K] taille (x' + paintingScaleMultiplier.toFixed(2) + ')<br>' +
      '<b>[ENTRÉE] ENREGISTRER LES TABLEAUX POUR TOUS</b>';
  }

  function selectPainting(idx) {
    if (!isAdminMode || paintingTextures.length === 0) return;
    currentPaintingIndex = ((idx % paintingTextures.length) + paintingTextures.length) % paintingTextures.length;
    updatePaintHud();
  }

  function hangCurrentPainting() {
    if (!isAdminMode || (!controls.isLocked && !touchControlsEnabled)) return;
    if (paintingTextures.length === 0) return;

    raycaster.set(camera.getWorldPosition(new THREE.Vector3()), camera.getWorldDirection(new THREE.Vector3()));
    raycaster.far = 100 * SCALE;
    var hits = raycaster.intersectObjects(collidableMeshes, false);
    if (hits.length === 0) return;
    var hit = hits[0];
    var normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();

    var data = paintingTextures[currentPaintingIndex];
    var baseHeight = 1.1 * SCALE * paintingScaleMultiplier;
    var baseWidth = baseHeight * data.aspect;

    var geo = new THREE.PlaneGeometry(baseWidth, baseHeight);
    var mat = new THREE.MeshBasicMaterial({ map: data.texture, side: THREE.DoubleSide });
    var mesh = new THREE.Mesh(geo, mat);

    var offset = 0.02 * SCALE;
    mesh.position.copy(hit.point).addScaledVector(normal, offset);

    var quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    mesh.quaternion.copy(quat);

    scene.add(mesh);
    var record = {
      index: currentPaintingIndex,
      position: { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z },
      normal: { x: normal.x, y: normal.y, z: normal.z },
      width: baseWidth,
      height: baseHeight
    };
    placedPaintings.push({ mesh: mesh, record: record });
  }

  function removeAimedPainting() {
    if (!isAdminMode || (!controls.isLocked && !touchControlsEnabled)) return;
    if (placedPaintings.length === 0) return;

    raycaster.set(camera.getWorldPosition(new THREE.Vector3()), camera.getWorldDirection(new THREE.Vector3()));
    raycaster.far = 100 * SCALE;
    var meshes = placedPaintings.map(function (p) { return p.mesh; });
    var hits = raycaster.intersectObjects(meshes, false);
    if (hits.length === 0) return;

    var hitMesh = hits[0].object;
    var idx = placedPaintings.findIndex(function (p) { return p.mesh === hitMesh; });
    if (idx === -1) return;

    var item = placedPaintings.splice(idx, 1)[0];
    scene.remove(item.mesh);
    item.mesh.geometry.dispose();
    item.mesh.material.dispose();
  }

  // ------------------------------------------------------------------
  // STOCKAGE PARTAGÉ EN LIGNE (remplace localStorage)
  // ------------------------------------------------------------------
  function savePaintings() {
    if (!isAdminMode) return;
    var records = placedPaintings.map(function (p) { return p.record; });
    fetch('https://api.jsonbin.io/v3/b/' + STORAGE_BIN_ID, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': ADMIN_KEY
      },
      body: JSON.stringify({ paintings: records })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function () {
        alert("Succès ! Les positions des tableaux ont été enregistrées. Elles s'afficheront désormais pour tous les visiteurs.");
      })
      .catch(function (err) {
        alert("Erreur lors de l'enregistrement : clé d'administration incorrecte ou problème de connexion.");
        console.error(err);
      });
  }

  function loadRemotePaintings() {
    return fetch('https://api.jsonbin.io/v3/b/' + STORAGE_BIN_ID + '/latest')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        return (data && data.record && data.record.paintings) ? data.record.paintings : [];
      })
      .catch(function (err) {
        console.error('Impossible de charger les tableaux enregistrés en ligne', err);
        return [];
      });
  }

  function createPaintingMesh(rec) {
    var data = paintingTextures[rec.index];
    if (!data) return;
    var geo = new THREE.PlaneGeometry(rec.width, rec.height);
    var mat = new THREE.MeshBasicMaterial({ map: data.texture, side: THREE.DoubleSide });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(rec.position.x, rec.position.y, rec.position.z);
    var normal = new THREE.Vector3(rec.normal.x, rec.normal.y, rec.normal.z);
    var quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    mesh.quaternion.copy(quat);
    scene.add(mesh);

    if (isAdminMode) {
      placedPaintings.push({ mesh: mesh, record: rec });
    }
  }

  var texturesPromise = fetch(PAINTINGS_ZIP_URL)
    .then(function (res) { return res.blob(); })
    .then(function (blob) { return JSZip.loadAsync(blob); })
    .then(function (zip) {
      var names = Object.keys(zip.files)
        .filter(function (n) { return /\.(jpe?g|png)$/i.test(n); })
        .sort();
      var promises = names.map(function (name) {
        return zip.files[name].async('blob').then(function (imgBlob) {
          var url = URL.createObjectURL(imgBlob);
          return new Promise(function (resolve) {
            textureLoader.load(url, function (tex) {
              if (tex.encoding !== undefined && THREE.sRGBEncoding !== undefined) tex.encoding = THREE.sRGBEncoding;
              var aspect = tex.image.naturalWidth / tex.image.naturalHeight;
              resolve({ texture: tex, aspect: aspect, name: name });
            });
          });
        });
      });
      return Promise.all(promises);
    })
    .catch(function (err) {
      console.error(err);
      return [];
    });

  Promise.all([texturesPromise, loadRemotePaintings()])
    .then(function (results) {
      paintingTextures = results[0];
      var remotePaintings = results[1];
      PRESET_PAINTINGS = remotePaintings;
      PRESET_PAINTINGS.forEach(function (rec) {
        createPaintingMesh(rec);
      });
      if (isAdminMode) {
        updatePaintHud();
      }
    });

  // ------------------------------------------------------------------
  // BOUTON ET FORMULAIRE DE CONTACT
  // ------------------------------------------------------------------
  var contactBtn = document.getElementById('g3d-contact-btn');
  var contactModal = document.getElementById('g3d-contact-modal');
  var contactCancel = document.getElementById('g3d-contact-cancel');
  var contactSend = document.getElementById('g3d-contact-send');
  var contactError = document.getElementById('g3d-contact-error');
  var contactStatus = document.getElementById('g3d-contact-status');
  var contactName = document.getElementById('g3d-contact-name');
  var contactEmail = document.getElementById('g3d-contact-email');
  var contactMessage = document.getElementById('g3d-contact-message');

  function openContactModal() {
    if (controls.isLocked) controls.unlock();
    contactError.style.display = 'none';
    contactStatus.style.display = 'none';
    contactModal.style.display = 'flex';
  }
  function closeContactModal() {
    contactModal.style.display = 'none';
  }

  contactBtn.addEventListener('click', openContactModal);
  contactCancel.addEventListener('click', closeContactModal);
  contactModal.addEventListener('click', function (e) {
    if (e.target === contactModal) closeContactModal();
  });

  function showContactStatus(text, ok) {
    contactStatus.textContent = text;
    contactStatus.style.color = ok ? '#7be495' : '#ff8686';
    contactStatus.style.display = 'block';
  }

  function emailJsConfigured() {
    return EMAILJS_SERVICE_ID.indexOf('VOTRE_') !== 0 &&
           EMAILJS_TEMPLATE_ID.indexOf('VOTRE_') !== 0 &&
           EMAILJS_PUBLIC_KEY.indexOf('VOTRE_') !== 0;
  }

  function sendWithMailto(name, email, message) {
    var subject = encodeURIComponent('Message depuis la galerie virtuelle - ' + name);
    var body = encodeURIComponent('Nom : ' + name + '\nEmail : ' + email + '\n\n' + message);
    window.location.href = 'mailto:' + CONTACT_EMAIL + '?subject=' + subject + '&body=' + body;
  }

  contactSend.addEventListener('click', function () {
    var name = contactName.value.trim();
    var email = contactEmail.value.trim();
    var message = contactMessage.value.trim();
    var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    contactStatus.style.display = 'none';
    if (!name || !emailOk || !message) {
      contactError.style.display = 'block';
      return;
    }
    contactError.style.display = 'none';

    // Sans configuration EmailJS, on garde l'ancien envoi par le logiciel mail du visiteur
    if (!emailJsConfigured()) {
      sendWithMailto(name, email, message);
      contactName.value = '';
      contactEmail.value = '';
      contactMessage.value = '';
      closeContactModal();
      return;
    }

    contactSend.disabled = true;
    contactSend.textContent = 'Envoi…';

    fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: EMAILJS_SERVICE_ID,
        template_id: EMAILJS_TEMPLATE_ID,
        user_id: EMAILJS_PUBLIC_KEY,
        template_params: {
          from_name: name,
          from_email: email,
          reply_to: email,
          message: message
        }
      })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        contactName.value = '';
        contactEmail.value = '';
        contactMessage.value = '';
        showContactStatus('Merci ! Ton message a bien été envoyé.', true);
        setTimeout(closeContactModal, 2000);
      })
      .catch(function (err) {
        console.error('EmailJS', err);
        showContactStatus("L'envoi a échoué. Réessaie dans un instant.", false);
      })
      .then(function () {
        contactSend.disabled = false;
        contactSend.textContent = 'Envoyer';
      });
  });
})();
</script>
